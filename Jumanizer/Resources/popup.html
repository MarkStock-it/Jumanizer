<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanizer</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .status-section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.active {
      background: #10b981;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
    }

    .status-text.active {
      color: #059669;
    }

    .status-text.inactive {
      color: #dc2626;
    }

    .api-status {
      font-size: 12px;
      color: #6b7280;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      margin-top: 8px;
    }

    .api-status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .api-status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .info-text {
      font-size: 12px;
      color: #6b7280;
      padding: 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      line-height: 1.5;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #10b981;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .toggle-label {
      font-size: 13px;
      color: #374151;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✨ Jumanizer</h1>
    </div>

    <div class="status-section">
      <div class="status-label">Status</div>
      
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Loading...</span>
      </div>

      <div class="toggle-group">
        <label class="toggle-switch">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Enable Extension</span>
      </div>

      <div class="api-status" id="apiStatus">
        Checking API key... (Gemini v1beta)
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="openOptions">Options</button>
      <button class="btn-secondary" id="openDocs">How to Use</button>
    </div>

    <div class="info-text">
      👆 Select any AI-generated text on a webpage and click "✨ Humanize" to make it sound more human.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
