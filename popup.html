<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanizer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      min-width: 340px;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      padding: 22px;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: #eff6ff;
      padding: 6px;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-section {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 22px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .status-label {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ef4444;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    .status-dot.active {
      background: #16a34a;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }

    .status-text.active {
      color: #0f766e;
    }

    .api-status {
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 12px;
      color: #475569;
      background: #eff6ff;
      border: 1px solid #dbeafe;
    }

    .api-status.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .api-status.ok {
      background: #ecfdf5;
      border-color: #d1fae5;
      color: #166534;
    }

    .button-group {
      display: grid;
      gap: 10px;
    }

    .button-group button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.12);
    }

    .button-group button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .info-text {
      margin: 0;
      padding: 16px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #475569;
      font-size: 13px;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <img class="brand-icon" src="humanize.svg" alt="Jumanizer logo">
      <h1 class="app-title">Jumanizer</h1>
    </div>

    <div class="status-section">
      <div class="status-label">Status</div>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Loading...</span>
      </div>

      <div class="toggle-group">
        <label class="toggle-switch">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Enable Extension</span>
      </div>

      <div class="api-status" id="apiStatus">
        Checking API key... (Gemini v1beta)
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="openOptions">Options</button>
      <button class="btn-secondary" id="openDocs">How to Use</button>
    </div>

    <p class="info-text">
      Select AI-generated text on a webpage and use the right-click menu to choose "Humanize this text".
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
