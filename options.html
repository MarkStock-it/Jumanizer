<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanizer Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f9fafb;
      color: #1f2937;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 16px;
      margin: 0 0 15px;
      color: #111827;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Monaco', 'Courier New', monospace;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .helper-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.5;
    }

    .helper-text a {
      color: #2563eb;
      text-decoration: none;
    }

    .helper-text a:hover {
      text-decoration: underline;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status.hidden {
      display: none;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      margin-top: 15px;
      gap: 10px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: 0.3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .toggle-label {
      font-size: 14px;
      color: #374151;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Jumanizer</h1>
  <p class="subtitle">Configure your extension settings</p>

  <div class="section">
    <h2>API Key</h2>
    <label for="apiKey">Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza...">
    <p class="helper-text">
      Get your API key from <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
    </p>
    <div class="button-group">
      <button class="btn-primary" id="save">Save Settings</button>
      <button class="btn-secondary" id="show-hide">Show</button>
    </div>
    <div id="status" class="status hidden"></div>
  </div>

  <div class="section">
    <h2>Extension Status</h2>
    <div class="toggle-group">
      <label class="toggle-switch">
        <input type="checkbox" id="extensionToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Enable Jumanizer</span>
    </div>
    <p class="helper-text" style="margin-top: 12px;">
      Toggle the extension on/off. When enabled, you can select text on any webpage and click the humanize button.
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
